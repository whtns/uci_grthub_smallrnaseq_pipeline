# Configuration file for Small RNA processing workflow

# Adapter sequences for small RNA v4 kit
adapters:
  read1: "TGGAATTCTCGGGTGCCAAGG"
  read2: "AGATCGGAAGAGCGTCGTGTAGGGAAAGA"

# Cutadapt parameters
cutadapt:
  min_length: 16
  quality_cutoff: 20
  cores: 4

# FastQC parameters
fastqc:
  threads: 8

# Resource allocation
resources:
  fastqc:
    mem_mb: 4000
    runtime: 60  # minutes
  cutadapt:
    mem_mb: 8000
    runtime: 120  # minutes

# Directory structure
directories:
  fastq_dir: "FastqFiles/hts.igb.uci.edu/rob25092453"
  fastqc_dir: "fastQC"
  trimmed_dir: "trimmed_fastq"
  logs_dir: "logs"

# SLURM cluster configuration (optional)
cluster:
  account: "SBSANDME_LAB"
  partition: "standard"
  nodes: 1
  ntasks: 1